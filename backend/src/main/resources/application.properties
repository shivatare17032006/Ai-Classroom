spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.bjkzpsyegqrgoseqemdv
spring.datasource.password=Aryanshivatare@17
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool (Optimized for Supabase Cloud Latency)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Common Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# Google Gemini 1.5 Pro AI API Configuration
# =========================================================
# Reads from environment variable GEMINI_API_KEY if present
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}

# =========================================================
# Spring AI Framework Configuration for Grading & Marking
# =========================================================
spring.ai.openai.api-key=${OPENAI_API_KEY:${GEMINI_API_KEY:demo-key}}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.2

# =========================================================
# Real Gmail SMTP Configuration for Actual Email Delivery
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:YOUR_GMAIL_ADDRESS_HERE}
spring.mail.password=${GMAIL_APP_PASSWORD:YOUR_16_CHAR_APP_PASSWORD_HERE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# =========================================================
# Enterprise Logging Configuration (Console & Server Disk Files)
# =========================================================
logging.file.name=logs/aiclassroom.log
logging.file.path=logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.com.aiclassroom=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
