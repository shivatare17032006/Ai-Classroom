# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=ai-enabled-classroom-backend

# =========================================================
# PostgreSQL Database Configuration (Active)
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aiclassroomdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# JPA & Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Google Gemini 1.5 Pro AI API Configuration
# =========================================================
# Reads from environment variable GEMINI_API_KEY if present, else fallback
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
