# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=ai-enabled-classroom-backend

# Import ignored local properties (for local API keys)
spring.config.import=optional:classpath:application-local.properties

# =========================================================
# PostgreSQL Database Configuration (Active)
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aiclassroomdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# JPA & Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Google Gemini 1.5 Pro AI API Configuration
# =========================================================
# Reads from environment variable GEMINI_API_KEY if present
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}

# =========================================================
# Spring AI Framework Configuration for Grading & Marking
# =========================================================
spring.ai.openai.api-key=${OPENAI_API_KEY:${GEMINI_API_KEY:demo-key}}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.2

# =========================================================
# Real Gmail SMTP Configuration for Actual Email Delivery
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:YOUR_GMAIL_ADDRESS_HERE}
spring.mail.password=${GMAIL_APP_PASSWORD:YOUR_16_CHAR_APP_PASSWORD_HERE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# =========================================================
# Enterprise Logging Configuration (Console & Server Disk Files)
# =========================================================
logging.file.name=logs/aiclassroom.log
logging.file.path=logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.com.aiclassroom=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
